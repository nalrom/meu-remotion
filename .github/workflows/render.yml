name: Renderizar Vídeo Reels

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  render:
    name: Renderizar Motion Reels no GitHub Actions
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Instalar Dependências
        run: npm install

      - name: Renderizar Vídeo MP4 (1080x1920 60fps)
        run: |
          mkdir -p out
          npx remotion render Educacao2027 out/reels-educacao-2027.mp4 --concurrency=2

      - name: Salvar Vídeo como Artefato para Download
        uses: actions/upload-artifact@v4
        with:
          name: reels-educacao-2027
          path: out/reels-educacao-2027.mp4
          retention-days: 14
